# NetBird self-hosted control plane + Dex (GitHub org SSO broker)
#
#   Traefik          :443 / :80   TLS termination, Let's Encrypt (TLS-ALPN-01)
#   netbird-server   internal :80 management + signal + relay + embedded IdP
#                    host    :3478/udp  STUN
#   dashboard        internal :80 web UI
#   dex              internal :5556 OIDC broker in front of GitHub
#
# Everything here comes from the generated ./.env (see netbird.example.yaml).
# Container names are prefixed with the compose project name so two
# deployments on one host cannot collide; set project.name in netbird.yaml.

volumes:
  netbird_data:
  netbird_pgdata:
  netbird_dex_data:
  netbird_traefik_letsencrypt:

networks:
  netbird:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

services:
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-netbird}-traefik
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.10
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=netbird"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.allowACMEByPass=true"
      # NetBird's management/signal gRPC streams are long-lived: any responding
      # timeout here silently kills peer connections after a few minutes.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0"
      # HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # Same reasoning as the responding timeouts, on the backend side.
      - "--serverstransport.forwardingtimeouts.responseheadertimeout=0s"
      - "--serverstransport.forwardingtimeouts.idleconntimeout=0s"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netbird_traefik_letsencrypt:/letsencrypt
    logging:
      driver: "json-file"
      options: { max-size: "500m", max-file: "2" }

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-netbird}-postgres
    restart: unless-stopped
    networks: [netbird]
    environment:
      POSTGRES_DB: netbird
      POSTGRES_USER: netbird
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - netbird_pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    command:
      - postgres
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "effective_cache_size=192MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbird -d netbird"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options: { max-size: "500m", max-file: "2" }

  netbird-server:
    image: ${NETBIRD_SERVER_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-netbird}-server
    restart: unless-stopped
    networks: [netbird]
    ports:
      # STUN is UDP and cannot be proxied, so it must be published on the host.
      - "3478:3478/udp"
    volumes:
      - netbird_data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml:ro
    command: ["--config", "/etc/netbird/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      # Changes when config.yaml's content changes, so `up -d` recreates the
      # container. Without it a re-render is a silent no-op: docker binds the
      # file by inode and the running container keeps the old one.
      - config.sha=${CONFIG_YAML_SHA}
      - traefik.enable=true
      # gRPC needs an h2c (HTTP/2 cleartext) backend.
      - traefik.http.routers.netbird-grpc.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`))
      - traefik.http.routers.netbird-grpc.entrypoints=websecure
      - traefik.http.routers.netbird-grpc.tls=true
      - traefik.http.routers.netbird-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-grpc.service=netbird-server-h2c
      - traefik.http.routers.netbird-grpc.priority=100
      # REST API, relay, WebSocket, and the embedded IdP's OAuth2 endpoints.
      - traefik.http.routers.netbird-backend.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      - traefik.http.routers.netbird-backend.entrypoints=websecure
      - traefik.http.routers.netbird-backend.tls=true
      - traefik.http.routers.netbird-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-backend.service=netbird-server
      - traefik.http.routers.netbird-backend.priority=100
      - traefik.http.services.netbird-server.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.scheme=h2c
    logging:
      driver: "json-file"
      options: { max-size: "500m", max-file: "2" }

  dashboard:
    image: ${DASHBOARD_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-netbird}-dashboard
    restart: unless-stopped
    networks: [netbird]
    environment:
      # Endpoints
      NETBIRD_MGMT_API_ENDPOINT: "https://${NETBIRD_DOMAIN}"
      NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://${NETBIRD_DOMAIN}"
      # OIDC: points at netbird-server's embedded IdP, not at Dex.
      # Dex is reached through the embedded IdP as an upstream connector.
      AUTH_AUDIENCE: "netbird-dashboard"
      AUTH_CLIENT_ID: "netbird-dashboard"
      AUTH_CLIENT_SECRET: ""
      AUTH_AUTHORITY: "https://${NETBIRD_DOMAIN}/oauth2"
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: "openid profile email groups"
      AUTH_REDIRECT_URI: "/nb-auth"
      AUTH_SILENT_REDIRECT_URI: "/nb-silent-auth"
      # TLS is terminated by Traefik, so the dashboard's own nginx stays plain.
      NGINX_SSL_PORT: "443"
      LETSENCRYPT_DOMAIN: "none"
    labels:
      - traefik.enable=true
      # priority 1: catch-all for the host, after the path-specific routers.
      - traefik.http.routers.netbird-dashboard.rule=Host(`${NETBIRD_DOMAIN}`)
      - traefik.http.routers.netbird-dashboard.entrypoints=websecure
      - traefik.http.routers.netbird-dashboard.tls=true
      - traefik.http.routers.netbird-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-dashboard.service=dashboard
      - traefik.http.routers.netbird-dashboard.priority=1
      - traefik.http.services.dashboard.loadbalancer.server.port=80
    logging:
      driver: "json-file"
      options: { max-size: "500m", max-file: "2" }

  dex:
    image: ${DEX_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME:-netbird}-dex
    restart: unless-stopped
    networks: [netbird]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    # No environment: dex/config.yaml is rendered complete by deploy.py, so
    # nothing is expanded at container runtime.
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
      - netbird_dex_data:/var/dex
    labels:
      - config.sha=${DEX_CONFIG_SHA}
      - traefik.enable=true
      - traefik.http.routers.netbird-dex.rule=Host(`${DEX_DOMAIN}`)
      - traefik.http.routers.netbird-dex.entrypoints=websecure
      - traefik.http.routers.netbird-dex.tls=true
      - traefik.http.routers.netbird-dex.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-dex.service=dex
      - traefik.http.services.dex.loadbalancer.server.port=5556
    logging:
      driver: "json-file"
      options: { max-size: "500m", max-file: "2" }
